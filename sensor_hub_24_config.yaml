module_name: "example_sensor_hub"

buckets:
    bucket_0:
        # NOTE: frequency will be converted to an integer number of ms for a delay
        frequency_hz: 100
        parameters:
            # Listed in order of their pins in the sensor hub board side connector
            brakeTempRearRight_C:
                ADC: ADC1_IN4
                sensor: brake_temp_sensor
                samples_buffered: 2
            shockPosRearRight_mm:
                ADC: ADC1_IN6
                sensor: rear_right_shock_pos
                samples_buffered: 2
            motorWaterPressure1_psi:
                ADC: ADC1_IN5
                sensor: pressure_sensor_absolute
                samples_buffered: 2
            motorWaterTempOut_psi:
                ADC: ADC1_IN7
                sensor: temp_sensor
                samples_buffered: 2
            motorWaterTempIn_psi:
                ADC: ADC1_IN14
                sensor: temp_sensor
                samples_buffered: 2
            wheelSpeedRearRight_mph:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 2